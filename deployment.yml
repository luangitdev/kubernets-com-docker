apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
      - name: web-app
        image: luandocs/flask-docker-swarm-load-balancing:latest
        ports:
        - containerPort: 5000
        imagePullPolicy: Always